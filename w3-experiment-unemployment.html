<!doctype html>
<!--
TUTORIAL CREDIT
Name: 【p5 js Tutorial】Swirling Pattern using Gradient for Generative Art
Artist / creator: Nekodigi
Year: 2021
Link: https://www.youtube.com/watch?v=3YaTRWkpXpQ
Tutorial's linked source: https://editor.p5js.org/ndeji69/sketches/EA17R4HHa

W3 EXPERIMENT — UNEMPLOYMENT / DISPLACEMENT
An abstract study of disruption and re-entry; this is not a data visualization.

RETAINED FROM THE TUTORIAL:
Random starting positions, p5 noise, and the curl() calculation: sample the
noise gradient using finite differences, then rotate it 90 degrees (cy, -cx).
The original also uses monochrome particles and accumulated trails.

DIFFERENT FROM THE TUTORIAL (marked CHANGE below):
1. Responsive full-window canvas instead of a fixed 500 × 500 canvas.
2. More particles, normalized high-speed flow, and slowly evolving 3D noise.
3. Charcoal fading background instead of the original generated noise image;
   thin silver/white strokes instead of the original 4-pixel white points.
4. Click/tap scattering within 100px plus spring return to moving flow positions.
5. Keyboard pause/resume, reduced-motion support, and resize handling.
   No visible text or controls; press Space to pause/resume.
All JavaScript and styling are kept in this single HTML file for study.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W3 Experiment — Unemployment</title>
  <style>
    /* CHANGE 1: a full-window, monochromatic presentation. */
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090909; color: #ededed; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
  <script>
    'use strict';

    // 1. SETTINGS — CHANGE: rapid movement and adjustable spring behavior.
    const FLOW_SPEED = 430;       // Pixels per second; higher means faster flow.
    const NOISE_SCALE = 210;      // Larger values make wider, smoother swirls.
    const SPRING = 22;            // Pull toward the moving flow position.
    const DAMPING = 7;            // Remove scatter energy so particles settle.
    const SCATTER_RADIUS = 100;    // Only particles within 100px of the click are disrupted.
    const SCATTER_SPEED = 1150;   // Initial click impulse, in pixels per second.
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let particles = [];
    let flowTime = 0;
    let paused = reducedMotion;

    // 2. SETUP — random positions follow the tutorial's starting approach.
    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      pixelDensity(1);
      frameRate(60);
      noiseDetail(1, 0); // Same noise-detail setting used in the tutorial.
      canvas.elt.setAttribute('role', 'img');
      canvas.elt.setAttribute('aria-label', 'Rapid silver particles swirl on charcoal. Click or tap to scatter them; they return to the flow.');
      // CHANGE: pointer events support both mouse and touch without double firing.
      canvas.elt.addEventListener('pointerdown', event => {
        if (event.isPrimary && event.button === 0 && !paused) {
          const bounds = canvas.elt.getBoundingClientRect();
          scatter((event.clientX - bounds.left) * width / bounds.width,
                  (event.clientY - bounds.top) * height / bounds.height);
        }
      });
      makeParticles();
      background(9);
      if (paused) { draw(); noLoop(); }
    }

    function makeParticles() {
      // CHANGE: density scales with screen area, capped for performance.
      const count = constrain(Math.round(width * height / 500), 850, 3000);
      particles = Array.from({ length: count }, () => ({
        home: createVector(random(width), random(height)),
        offset: createVector(0, 0),
        velocity: createVector(0, 0),
        speed: random(0.8, 1.3),
        shade: random(125, 255), // Only grayscale: equal red, green, blue.
        weight: random(1.6, 2.6) // CHANGE: slightly larger particles.
      }));
    }

    // 3. FLOW FIELD — RETAINED: Nekodigi's finite-difference curl method.
    // CHANGE: z evolves slowly over time; the original samples static 2D noise.
    function curl(x, y, z) {
      const EPSILON = 0.001;
      const cx = (noise(x + EPSILON, y, z) - noise(x - EPSILON, y, z)) / (2 * EPSILON);
      const cy = (noise(x, y + EPSILON, z) - noise(x, y - EPSILON, z)) / (2 * EPSILON);
      return createVector(cy, -cx); // Rotate the gradient by 90 degrees.
    }

    // 4. ANIMATION — CHANGE: timed, fast flow with thin fading trails.
    function draw() {
      // Clamp long frames; small integration steps keep spring motion stable.
      const dt = paused ? 0 : Math.min(deltaTime / 1000, 0.04);
      const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
      const h = dt / steps;
      // Time-correct fading keeps a similar trail length across frame rates.
      background(9, paused ? 255 : 255 * (1 - Math.exp(-4.8 * dt)));
      for (const p of particles) {
        const oldX = p.home.x + p.offset.x;
        const oldY = p.home.y + p.offset.y;
        let wrapped = false;
        for (let step = 0; step < steps; step++) {
          const direction = curl(p.home.x / NOISE_SCALE, p.home.y / NOISE_SCALE, flowTime);
          // CHANGE: normalize and scale to maintain visibly rapid motion.
          direction.setMag(FLOW_SPEED * p.speed * h);
          p.home.add(direction);
          // CHANGE: wrap at edges; skip connecting strokes across the canvas.
          if (p.home.x < 0 || p.home.x >= width || p.home.y < 0 || p.home.y >= height) {
            p.home.x = (p.home.x % width + width) % width;
            p.home.y = (p.home.y % height + height) % height;
            wrapped = true;
          }

          // 5. RETURN — CHANGE: damped spring removes the click displacement.
          // The invisible 'home' keeps flowing during disruption. Each visible
          // particle returns to its own moving home, not to the click location.
          p.velocity.x += (-SPRING * p.offset.x - DAMPING * p.velocity.x) * h;
          p.velocity.y += (-SPRING * p.offset.y - DAMPING * p.velocity.y) * h;
          p.offset.x += p.velocity.x * h;
          p.offset.y += p.velocity.y * h;
        }
        const x = p.home.x + p.offset.x;
        const y = p.home.y + p.offset.y;
        stroke(p.shade, 190);
        strokeWeight(p.weight);
        if (!wrapped) line(oldX, oldY, x, y);
        point(x, y);
      }
      flowTime += dt * 0.055;
    }

    // 6. SCATTER — CHANGE: an outward burst affects only particles within 100px.
    function scatter(x, y) {
      for (const p of particles) {
        const dx = p.home.x + p.offset.x - x;
        const dy = p.home.y + p.offset.y - y;
        const distance = Math.hypot(dx, dy);
        // Test the visible position at click time, including any existing offset.
        if (distance > SCATTER_RADIUS) continue;
        const angle = (distance < 1 ? random(TWO_PI) : Math.atan2(dy, dx)) + random(-0.45, 0.45);
        const impulse = SCATTER_SPEED * random(0.65, 1.2) * (0.6 + 0.4 * Math.exp(-distance / 350));
        p.velocity.x += Math.cos(angle) * impulse;
        p.velocity.y += Math.sin(angle) * impulse;
        p.velocity.limit(SCATTER_SPEED * 1.8); // Repeated clicks stay bounded.
      }
    }

    // 7. CONTROLS / RESIZE — CHANGE: pause and reduced-motion support.
    // Space replaces the visible button, keeping the artwork free of text.
    window.addEventListener('keydown', event => {
      if (event.code !== 'Space' || event.repeat) return;
      event.preventDefault();
      paused = !paused;
      if (paused) noLoop(); else loop();
    });
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      makeParticles();
      background(9);
      if (paused) redraw();
    }
  </script>
</body>
</html>
