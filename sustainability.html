<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generative Succulents</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f2eddf; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
<script>

// 1. SETTINGS: change these to alter the garden.
const PLANT_COUNT = 17;
const LEAVES = 9;
const palette = ['#537b67', '#709882', '#8fa58b', '#a2ad86', '#668f88'];
const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let plants = [];
let time = 0;

// 2. SETUP: generate each plant once, so its random details stay stable.
function setup() {
  const canvas = createCanvas(windowWidth, windowHeight);
  canvas.elt.setAttribute('role', 'img');
  canvas.elt.setAttribute('aria-label', 'A garden of layered green succulent rosettes gently breathing on cream paper.');
  pixelDensity(1);
  frameRate(30);
  makeGarden();
  if (still) noLoop();
}

function makeGarden() {
  plants = [];
  const columns = width > height ? 5 : 3;
  const rows = Math.ceil(PLANT_COUNT / columns);
  const cell = Math.min(width / (columns + 0.4), height / (rows + 0.3));
  for (let i = 0; i < PLANT_COUNT; i++) {
    plants.push({
      x: width / 2 + (i % columns - (columns - 1) / 2) * cell + random(-cell * 0.12, cell * 0.12),
      y: height / 2 + (Math.floor(i / columns) - (rows - 1) / 2) * cell + random(-cell * 0.12, cell * 0.12),
      size: cell * random(0.38, 0.55),
      angle: random(TWO_PI),
      colour: random(palette),
      phase: random(TWO_PI)
    });
  }
}

// 3. ANIMATION: redraw the same garden with a very small breathing motion.
function draw() {
  background('#f2eddf');
  if (!still) time += Math.min(deltaTime, 50) / 1000;
  for (const plant of plants) {
    push();
    translate(plant.x, plant.y);
    rotate(plant.angle);
    const breath = 1 + sin(time * 0.65 + plant.phase) * 0.025;
    scale(breath);
    drawPlant(plant.size, plant.colour);
    pop();
  }
}

// 4. SHAPE: three rings of pointed leaves form one succulent.
function drawPlant(size, colour) {
  stroke('#355a46');
  strokeWeight(0.6);
  for (let ring = 0; ring < 3; ring++) {
    const length = size * (1 - ring * 0.27);
    const tint = lerpColor(color(colour), color('#d4dfb5'), ring * 0.22);
    fill(tint);
    for (let leaf = 0; leaf < LEAVES; leaf++) {
      push();
      rotate(leaf * TWO_PI / LEAVES + ring * 0.34);
      beginShape();
      vertex(0, 0);
      bezierVertex(-length * 0.34, -length * 0.4, -length * 0.22, -length * 0.82, 0, -length);
      bezierVertex(length * 0.22, -length * 0.82, length * 0.34, -length * 0.4, 0, 0);
      endShape(CLOSE);
      pop();
    }
  }
  noStroke();
  fill('#dbe2bd');
  circle(0, 0, size * 0.09);
}

// 5. RESIZE: rebuild the composition to fit the new screen.
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeGarden();
  redraw();
}
</script>
</body>
</html>
