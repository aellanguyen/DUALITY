<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generative Artwork 2 — Duality</title>
<link rel="stylesheet" href="./generative-artwork-2.css">
</head>
<body>
<script>if(new URLSearchParams(location.search).get('embed')==='background')document.documentElement.classList.add('embed-background');</script>
<div id="stage">
<!-- B. HTML = THE VISIBLE CONTAINERS.
     id="..." is a unique name JavaScript can use to find an element.
     class="..." connects an element to the CSS rules above.
     p5 creates its canvas inside #artwork. The quote starts empty until generation. -->
<main id="artwork" aria-label="Interactive abstract monochrome composition"></main>
<div class="quote"><h1></h1></div>
</div>
<!-- Load our classic scripts in this order. "defer" waits for the HTML to be ready.
     All artwork dependencies are beside this HTML file.
     Use Live Server: external GLSL files must be loaded through HTTP. -->
<script defer src="./p5.min.js"></script>
<script defer src="./generative-artwork-2-quotes.js"></script>
<script defer src="./generative-artwork-2-generator.js"></script>
<script defer src="./generative-artwork-2-sketch.js"></script>
</body>
</html>
