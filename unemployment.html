<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clouds of Work</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
<script>

// 1. SETTINGS: words form the clouds instead of solid shapes.
const CLOUD_COUNT = 5;
const DRIFT_SPEED = 9;
const WORDS = ['WORK', 'MOVE', 'REST', 'WHY', 'TOMORROW', 'CHOICE'];
const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let clouds = [];
let time = 0;

// 2. SETUP: give each cloud a position and a fixed collection of word-points.
function setup() {
  const canvas = createCanvas(windowWidth, windowHeight);
  canvas.elt.setAttribute('role', 'img');
  canvas.elt.setAttribute('aria-label', 'White clouds made of words about work and rest drift slowly across a black background.');
  pixelDensity(1);
  frameRate(30);
  textFont('monospace');
  textAlign(CENTER, CENTER);
  makeClouds();
  if (still) noLoop();
}

function makeClouds() {
  clouds = [];
  const unit = Math.min(width / 3.2, height / 2.5);
  for (let i = 0; i < CLOUD_COUNT; i++) {
    const points = [];
    // Keep only grid positions inside a softly irregular oval.
    for (let y = -4; y <= 4; y++) {
      for (let x = -6; x <= 6; x++) {
        const edge = (x / 6) ** 2 + (y / 4) ** 2;
        if (edge < 0.65 + noise(x * 0.4 + 10, y * 0.4 + i * 10) * 0.45) {
          points.push({x: x * unit * 0.11, y: y * unit * 0.085,
            word: random(WORDS), phase: random(1000)});
        }
      }
    }
    clouds.push({
      x: (i + 0.5) / CLOUD_COUNT * width,
      y: height * [0.26, 0.65, 0.38, 0.76, 0.23][i],
      size: unit,
      speed: random(0.7, 1.2),
      points: points
    });
  }
}

// 3. ANIMATION: move whole clouds slowly, wrapping them around the screen.
function draw() {
  background(0);
  if (!still) time += Math.min(deltaTime, 50) / 1000;
  fill(255);
  noStroke();
  for (const cloud of clouds) {
    const margin = cloud.size;
    const x = (cloud.x + time * DRIFT_SPEED * cloud.speed + margin) % (width + margin * 2) - margin;
    drawCloud(cloud, x);
  }
}

// 4. SHAPE: smooth noise gently shifts each word within its cloud.
function drawCloud(cloud, x) {
  push();
  translate(x, cloud.y);
  textSize(Math.max(5, cloud.size * 0.035));
  for (const point of cloud.points) {
    const sway = (noise(point.phase, time * 0.16) - 0.5) * cloud.size * 0.07;
    text(point.word, point.x, point.y + sway);
  }
  pop();
}

// 5. RESIZE: generate a new arrangement fitted to the new screen.
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeClouds();
  redraw();
}
</script>
</body>
</html>
